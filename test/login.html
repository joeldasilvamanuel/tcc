<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <title>Health Access Hub | Login - Cadastro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/logo02.png">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/auth/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace, sans-serif;
        }

        body {
            height: 100vh;
            background:
                linear-gradient(180deg, #0aa5ff25, #008cff2c),
                url("/img/healthFundo.jpg") no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 1100px;
            height: 560px;
            background: #fff;
            border-radius: 26px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
        }

        .left {
            width: 50%;
            background: #08a9ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box {
            width: 320px;
            height: 320px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 110px;
            color: #fff;
        }

        img {
            width: 400px;
            height: 400px;
        }

        .right {
            width: 50%;
            position: relative;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            width: 380px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: absolute;
            transition: all 0.5s ease;
        }

        .form-card h2 {
            margin-bottom: 25px;
            font-size: 26px;
            color: #444;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 44px;
            border-radius: 6px;
            border: 1px solid #dce4ec;
            background: #f7faff;
        }

        .toggle-password {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
        }

        .label {
            font-size: 12px;
            color: #777;
            display: block;
            margin-bottom: 5px;
        }

        .form-card select,
        .form-card input[type="date"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #dce4ec;
            background: #f7faff;
        }

        .forgot {
            text-align: right;
            margin-bottom: 15px;
        }

        .forgot a {
            font-size: 13px;
            color: #0a5cff;
            text-decoration: none;
        }

        .form-card button {
            width: 100%;
            padding: 14px;
            background: #0a5cff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-card button:hover {
            background: #084bd6;
        }

        .divider {
            height: 1px;
            background: #e6e6e6;
            margin: 18px 0;
        }

        .switch {
            font-size: 14px;
            text-align: center;
            color: #777;
        }

        .switch a {
            color: #0a5cff;
            text-decoration: none;
            font-weight: 500;
        }

        .login {
            opacity: 1;
            transform: translateX(0);
        }

        .register {
            opacity: 0;
            transform: translateX(40px);
            pointer-events: none;
        }

        .right.active .login {
            opacity: 0;
            transform: translateX(-40px);
            pointer-events: none;
        }

        .right.active .register {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }

        /* MANTÉM TODO O TEU CÓDIGO ORIGINAL ACIMA E ADICIONA ISTO NO FINAL */

        @media (max-width: 1120px) {
            .main-card {
                width: 95%;
                /* Ajusta a largura em ecrãs médios */
                height: auto;
                min-height: 560px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
                height: auto;
                min-height: 100vh;
            }

            .main-card {
                flex-direction: column;
                /* Empilha o logo e o formulário */
                width: 100%;
                max-width: 450px;
                height: auto;
                border-radius: 15px;
            }

            .left {
                width: 100%;
                padding: 30px;
                height: 180px;
                /* Reduz a área do logo no mobile */
            }

            img {
                width: 150px;
                /* Reduz o tamanho da imagem da logo */
                height: auto;
            }

            .right {
                width: 100%;
                padding: 40px 20px;
                min-height: 480px;
                /* Garante espaço para o formulário */
            }

            .form-card {
                position: relative;
                /* No mobile, o formulário flui melhor fora do absolute */
                width: 100%;
                max-width: 100%;
                box-shadow: none;
                /* Remove sombra interna para parecer mais limpo */
                padding: 20px 10px;
            }

            /* Ajuste para manter a lógica de troca (toggle) funcionando no mobile */
            .register {
                display: none;
            }

            .right.active .login {
                display: none;
            }

            .right.active .register {
                display: block;
                opacity: 1;
                transform: translateX(0);
                pointer-events: all;
            }
        }
    </style>
</head>

<body>

    <div class="main-card">
        <div class="left">
            <div class="logo">
                <img src="/img/logo02.png" alt="logotipo da app">
            </div>
        </div>

        <div class="right" id="panel">

            <!-- LOGIN -->
            <form class="form-card login" action="/auth/login" method="POST">
                <h2>Entrar</h2>

                <div class="input-group">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" id="loginPassword" placeholder="Senha" required>
                    <span class="toggle-password" onclick="togglePassword('loginPassword', this)">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>

                <div class="forgot">
                    <a href="/recuperar">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <div class="divider"></div>

                <!-- <div class="switch">
                    Não tem conta?
                    <a href="#" onclick="toggle()">Criar uma conta</a>
                    <a href="#" onclick="toggle()">Agendar Uma Consulta</a>
                </div> -->
                <div class="switch">
                    Marque uma hora connosco!
                    <br>
                    <a href="/start" target="_blank">Agendar Uma Consulta</a>
                </div>
            </form>

            <!-- nao estou a usar isso daqui, pode nao fazer isso -->
            <!-- CADASTRO -->
            <form class="form-card register" action="/auth/register/utente" method="POST">
                <h2>Criar conta</h2>

                <div class="input-group">
                    <i class="bi bi-person"></i>
                    <input type="text" name="nome" placeholder="Nome Completo" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" id="registerPassword" placeholder="Senha" required>
                    <span class="toggle-password" onclick="togglePassword('registerPassword', this)">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>

                <label class="label">Data de Nascimento</label>
                <input type="date" name="data_nascimento" required>

                <select name="sexo" required>
                    <option value="">Selecione o Gênero</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                </select>

                <button type="submit">Cadastrar</button>

                <div class="divider"></div>

                <div class="switch">
                    Já tem conta?
                    <a href="#" onclick="toggle()">Entrar</a>
                </div>
            </form>
            <!-- fora de uso. -->
        </div>
    </div>

    <script src="/js/utente/utenteDash.js"></script>
    <script>
        function toggle() {
            document.getElementById("panel").classList.toggle("active");
        }

        function togglePassword(inputId, el) {
            const input = document.getElementById(inputId);
            const icon = el.querySelector("i");

            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        // para mostrar que a senha foi trocada
        const params = new URLSearchParams(window.location.search);
        if (params.get('reset') === 'sucesso') {
            alert('Senha alterada com sucesso! Faca login com a nova senha.')
        }
    </script>
</body>

</html>
