<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/logo02.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/prof/mensagens.css">
    <link rel="stylesheet" href="/css/utente/mensagens.css">
    <title>Health Access Hub | Mensagens Profissional</title>
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside id="sidebar" class="expanded">

            <div class="sidebar-top">
                <div class="logo-box" id="logoBox">
                    <img src="/img/logo02.png" alt="Health Access Hub">
                    <div class="logo-overlay">
                        <i class="fa-solid fa-bars"></i>
                    </div>
                </div>
                <span class="logo-text">Health Access Hub</span>
                <button id="toggleSidebar" class="toggle-btn" title="Recolher menu">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>

            <!-- MENU -->
            <nav class="navbar">
                <ul class="nav-list">
                    <li>
                        <a href="/dashboard/profissional/enfermeiro/" class="nav-link">
                            <i class="fa-solid fa-house"></i><span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/enfermeiro/monitorar" class="nav-link">
                              <i class="fa-solid fa-chart-line"></i><span>Monitorar</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/enfermeiro/utentes" class="nav-link">
                            <i class="fa-solid fa-users"></i><span>Utentes</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/enfermeiro/mensagens" class="nav-link active">
                            <i class="fa-solid fa-message"></i><span>Mensagens</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/enfermeiro/agendamento"  class="nav-link">
                            <i class="fa-solid fa-calendar-check"></i><span>Agendamento</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/enfermeiro/perfil" class="nav-link">
                            <i class="fa-solid fa-user"></i><span>Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <a href="/dashboard/profissional/enfermeiro/definicoes" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Definições</span>
            </a>

            <!-- LOGOUT -->
            <div class="logout-area">
                <a href="/auth/logout" class="nav-link logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span> </a>
            </div>
        </aside>

        <!-- MAIN -->
        <main>
            <div class="chat-wrapper">
                <!-- PAINEL CONVERSAS -->
                <div class="conversations-panel" id="conversationsPanel">
                    <div class="conversations-header">
                        <div class="user-header-info">
                            <div class="user-avatar-sm" id="userAvatarBtn"><i class="fa-solid fa-comments"></i></div>
                            <span class="user-name-sm" id="sidebarUserName">Conversas</span>
                        </div>
                        <div class="header-actions">
                            <i class="fa-regular fa-circle-check"></i>
                            <i class="fa-regular fa-message"></i>
                            <i class="fa-regular fa-ellipsis-vertical"></i>
                        </div>
                    </div>
                    <div class="search-area">
                        <div class="search-box-chat">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchConversations"
                                placeholder="Procurar ou criar uma nova conversa">
                        </div>
                    </div>
                    <div class="conversations-list" id="conversationsList"></div>
                </div>

                <div class="chat-area" id="emptyChat">
                    <div style="
                    display:flex; 
                    flex-direction:column; 
                    justify-content:center;
                    align-items:center; 
                    width:100%; 
                    height:100%; 
                    text-align:center; 
                    padding:40px;">

                        <i class="fa-solid fa-comments" style="font-size:60px; margin-bottom:20px; opacity:.5;"> </i>

                        <h2>Nenhuma conversa selecionada</h2>

                        <p>Aguarde mensagens dos utentes.</p>
                    </div>
                </div>

                <!-- ÁREA PRINCIPAL CHAT -->
                <div class="chat-area" id="chatArea" style="display:none;">

                    <div class="chat-header-whats">
                        <div class="chat-contact-info">
                            <button class="back-mobile" id="backMobileBtn">
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>

                            <div class="contact-avatar">
                                <i class="fa-solid fa-user-doctor" id="contactAvatarIcon"></i>
                            </div>

                            <div class="contact-details">
                                <h4 id="contactName"></h4>

                                <div class="contact-status">
                                    <span class="online-dot" id="statusDot"></span>
                                    <span id="statusText">Online</span>
                                </div>
                            </div>
                        </div>

                        <div class="chat-actions">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <i class="fa-regular fa-circle-user"></i>
                            <i class="fa-regular fa-ellipsis-vertical"></i>
                        </div>
                    </div>

                    <div class="messages-area" id="messagesArea"></div>

                    <div class="input-area">
                        <div class="input-icons">
                            <i class="fa-regular fa-face-smile"></i>
                            <i class="fa-regular fa-paperclip"></i>
                        </div>

                        <input type="text" class="message-input" id="messageInput" placeholder="Escrever mensagem">

                        <div class="send-icon" id="sendBtn">
                            <i class="fa-regular fa-paper-plane"></i>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/profissional/mensagens.js"></script>
    <script src="/js/header.js"></script>

    <!-- menu lateral -->
    <script>
        (function () {
            // Executa imediatamente para evitar flickers visuais na transição de páginas
            const sidebar = document.getElementById("sidebar");
            const savedState = localStorage.getItem('sidebarState');

            if (savedState === 'collapsed' && sidebar) {
                sidebar.className = 'collapsed';
            } else if (sidebar) {
                sidebar.className = 'expanded';
            }

            // Aguarda o DOM estar pronto para mapear os cliques de forma global
            document.addEventListener("DOMContentLoaded", () => {
                const sidebarEl = document.getElementById("sidebar");

                document.addEventListener("click", (e) => {
                    // 1. Clique no botão de fechar/recolher
                    const toggleBtn = e.target.closest("#toggleSidebar");
                    if (toggleBtn && sidebarEl) {
                        e.preventDefault();
                        e.stopPropagation();
                        sidebarEl.className = 'collapsed';
                        localStorage.setItem('sidebarState', 'collapsed');
                        return;
                    }

                    // 2. Clique no Logotipo para expandir (Apenas se estiver recolhido)
                    const logoBox = e.target.closest("#logoBox");
                    if (logoBox && sidebarEl) {
                        if (sidebarEl.classList.contains("collapsed")) {
                            e.preventDefault();
                            e.stopPropagation();
                            sidebarEl.className = 'expanded';
                            localStorage.setItem('sidebarState', 'expanded');
                        }
                    }
                });
            });
        })();
    </script>
</body>

</html>
