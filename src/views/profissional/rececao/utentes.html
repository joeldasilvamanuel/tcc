<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/logo02.png">
    <!-- Font Awesome (Ícones reais, não emoji) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/prof/rececao/cadastrarUtente.css">
    <link rel="stylesheet" href="/css/prof/perfil.css">
    <link rel="stylesheet" href="/css/prof/profUtentes.css">
    <link rel="stylesheet" href="/css/prof/profDash.css">
    <style>
        img .img {
            width: 100vh;
            height: auto;
        }
    </style>
    <title>Health Access Hub | Utentes</title>
</head>

<body>
    <div class="app">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="expanded">
            <!-- TOPO -->
            <div class="sidebar-top">
                <div class="logo-box">
                    <img src="/img/logo02.png" alt="Health Access Hub">
                </div>

                <button id="toggleSidebar" class="toggle-btn">
                    <!-- <i class="fa-solid fa-chevron-left"></i> -->
                    <!-- <i class="fa-solid fa-columns"></i> -->
                    <i class="fa-solid fa-angles-left"></i>
                </button>
                <!-- <i class="fa-solid fa-bars"></i><i class="fa-solid fa-outdent"></i> -->
            </div>

            <!-- MENU -->
            <nav class="navbar">
                <ul class="nav-list">
                    <li>
                        <a href="/dashboard/profissional/rececao/" class="nav-link">
                            <i class="fa-solid fa-house"></i><span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/rececao/utentes" class="nav-link active">
                            <i class="fa-solid fa-users"></i><span>Gerir Utentes</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/rececao/mensagens" class="nav-link">
                            <i class="fa-solid fa-message"></i><span>Mensagens</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/profissional/rececao/perfil" class="nav-link">
                            <i class="fa-solid fa-user"></i><span>Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <a href="/dashboard/profissional/rececao/definicoes" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Definições</span>
            </a>

            <!-- LOGOUT -->
            <div class="logout-area">
                <a href="/auth/logout" class="nav-link logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span> </a>
            </div>
        </aside>

        <main id="mainContent">
            <header class="main-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="searchUtente" placeholder="Pesquisar utente por nome ou ID...">
                </div>

                <div class="header-right">
                    <!-- Abas que outrora estavao no menu lateral -->
                    <a href="/dashboard/profissional/rececao/agendamento" style="background: #007bff;" class="nav-link">
                        <abbr title="Agendamento">
                            <i class="fa-solid fa-calendar-check"></i>
                        </abbr>
                        <!-- <span>Agendamento</span> -->
                    </a>
                    <a href="/dashboard/profissional/rececao/alertas" style="background: #007bff;" class="nav-link">
                        <abbr title="Alertas">
                            <i class="fa-solid fa-bell"></i>
                        </abbr>
                        <!-- <span>Alertas</span> -->
                    </a>

                    <div class="user-profile">
                        <div class="user-avatar">
                            <img src="/img/fotoPadra.png" alt="Avatar" id="headerAvatar">
                        </div>
                        <div class="user-info">
                            <p class="user-name" id="userName">...</p>
                            <p class="user-role" id="userRole">...</p>
                        </div>
                    </div>
                </div>
            </header>

            <section class="cadaUtente">
                <!-- formCU -->
                <div class="card">
                    <div class="card-header">
                        <h3>Cadastro de Novo Utente</h3>
                        <p>Preencha os dados abaixo para registar o paciente na clinica</p>
                    </div>

                    <form action="" id="formUtente" method="" novalidate>
                        <div id="alertBox" class="alert"></div>

                        <div class="grid">
                            <div>
                                <label class="required" for="name">Nome Completo</label>
                                <input type="text" name="name" id="name" required>
                            </div>

                            <div>
                                <label class="required" for="nascimento">Data de nascimento</label>
                                <input type="date" name="nascimento" id="nascimento" required>
                            </div>

                            <div>
                                <label class="required" for="genero">Genero</label>
                                <select name="genero" id="genero">
                                    <option value="">Selecione o Genero</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Feminino</option>
                                </select>
                            </div>

                            <div>
                                <label for="bi" class="required"></label>
                                <input type="text" name="bi" id="bi" required placeholder="Numero do BI">
                                <div class="hint">Bilhete de Identidade</div>
                            </div>

                            <div>
                                <label for="telefone" class="required">Telefone</label>
                                <input type="tel" name="telefone" id="telefone" required placeholder="+244 9XX XXX XXX">
                            </div>

                            <div>
                                <label class="required" for="email">Email</label>
                                <input type="email" name="email" id="email" required placeholder="example@gmail.com">
                            </div>

                            <div class="full">
                                <label class="required" for="endereco">Endereco completo</label>
                                <input type="text" name="enderece" id="endereco" required>
                            </div>

                            <div>
                                <label class="required" for="contactoEmergencia">Contacto de emergencia</label>
                                <input type="text" name="contactoEmergencia" id="contactoEmergencia" required
                                    placeholder="+244 9XX XXX XXX">
                            </div>

                            <div>
                                <label class="required" for="convenio">Seguro de Saude</label>
                                <input type="text" name="convenio" id="convenio" placeholder="Opcional">
                            </div>

                            <div class="full">
                                <label for="obs">Observacoes Medicas</label>
                                <textarea name="obs" id="obs" rows="3"
                                    placeholder="Alergias, medicacoes em uso, doencas cronicas..."></textarea>
                            </div>

                            <div>
                                <label class="required" for="senha">Senha</label>
                                <input type="password" name="senha" id="senha" required placeholder="Digite uma senha">
                            </div>

                            <div>
                                <label class="required" for="senha">Confirmar senha</label>
                                <input type="password" name="confirmarsenha" id="confirmarsenha" required placeholder="Confirme a Senha">
                            </div>

                            <div class="actions">
                                <button type="submit">Cadastrar Utente</button>
                                <button type="reset">Limpar</button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="imprimirCredenciais">
                    <h3>Baixe as credenciais do novo Utente ou imprima</h3>
                    <button class="btn-add-utente" type="submit">Baixar | Imprimir</button>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/profDash.js"></script>
    <script src="/js/header.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Se estivermos na página de utentes, carrega a lista
            if (document.getElementById('utentesList')) {
                carregarUtentesDoBanco();
            }
        });

        async function carregarUtentesDoBanco() {
            try {
                const response = await fetch('/api/utentes');
                const utentes = await response.json();

                const tabelaCorpo = document.getElementById('utentesList');
                tabelaCorpo.innerHTML = ''; // Limpa o exemplo estático

                utentes.forEach(utente => {
                    // Calcular idade básica (opcional)
                    const idade = utente.data_nascimento ?
                        new Date().getFullYear() - new Date(utente.data_nascimento).getFullYear() : 'N/A';

                    // Definir classe de status (estável ou crítico)
                    const statusClass = utente.status_saude === 'Crítico' ? 'critical' : 'stable';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                <td>
                    <div class="paciente-info">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(utente.nome)}&background=random" alt="Avatar">
                        <div>
                            <p class="nome">${utente.nome}</p>
                            <p class="sub">${utente.genero || 'Não definido'}, ${idade} anos</p>
                        </div>
                    </div>
                </td>
                <td><span class="id-tag">#${utente.id}</span></td>
                <td><span class="status-pill ${statusClass}">${utente.status_saude || 'Estável'}</span></td>
                <td>Há momentos</td>
                <td>
                    <div class="actions-cell">
                        <a href="/dashboard/profissional/monitorar">
                           <button onclick="verMonitorizacao(${utente.id})" title="Ver Monitorização"><i class="fa-solid fa-chart-line"></i></button>
                        </a>
                        <a href="/dashboard/profissional/mensagens">
                            <button onclick="abrirChat(${utente.id})" title="Enviar Mensagem"><i class="fa-solid fa-comment-medical"></i></button>
                        </a>
                        <a href="/dashboard/profissional/mensagens">
                            <button onclick="verProntuario(${utente.id})" title="Prontuário"><i class="fa-solid fa-file-medical"></i></button>
                        </a>
                    </div>
                </td>
            `;
                    tabelaCorpo.appendChild(tr);
                });

                // Atualiza o contador no topo
                const contador = document.querySelector('.title-group p');
                if (contador) contador.textContent = `Total de ${utentes.length} pacientes sob sua supervisão`;

            } catch (err) {
                console.error('Erro ao carregar utentes:', err);
            }
        }
    </script>
</body>

</html>
