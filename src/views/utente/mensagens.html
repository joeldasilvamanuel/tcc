<!DOCTYPE html>
<html lang="pt" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/img/logo02.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/utente/mensagens.css">
    <title>Health Access Hub | Mensagens</title>
</head>

<body>
    <div class="app">
        <!-- SIDEBAR ORIGINAL (INALTERADA) -->
        <aside id="sidebar" class="expanded">
            <div class="sidebar-top">
                <div class="logo-box"><img src="/img/logo02.png" alt="Health Access Hub"></div>
                <button id="toggleSidebar" class="toggle-btn"><i class="fa-solid fa-angles-left"></i></button>
            </div>
            <nav class="navbar">
                <ul class="nav-list">
                    <li>
                        <a href="/dashboard/utente" class="nav-link">
                            <i class="fa-solid fa-house"></i><span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/utente/exames" class="nav-link">
                            <i class="fa-solid fa-file-medical"></i><span>Sinais Vitais</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/utente/mensagens" class="nav-link active">
                            <i class="fa-solid fa-message"></i><span>Mensagens</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/utente/consultas" class="nav-link">
                            <i class="fa-solid fa-calendar-check"></i><span>Agendar Consultas</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/utente/prescricao" class="nav-link">
                            <i class="fa-solid fa-file-prescription"></i><span>Prescrição</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/utente/historico" class="nav-link">
                            <i class="fa-solid fa-notes-medical"></i><span>Histórico Clínico</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/utente/perfil" class="nav-link">
                            <i class="fa-solid fa-user"></i><span>Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="logout-area"><a href="/auth/logout" class="nav-link logout"><i
                        class="fa-solid fa-right-from-bracket"></i><span>Sair</span></a></div>
        </aside>


        <!--MAIN - chat em tempo real -->
        <main>
            <div class="chat-wrapper">
                <!-- PAINEL CONVERSAS -->
                <div class="conversations-panel" id="conversationsPanel">
                    <div class="conversations-header">
                        <div class="user-header-info">
                            <div class="user-avatar-sm" id="userAvatarBtn"><i class="fa-solid fa-user-circle"></i></div>
                            <span class="user-name-sm" id="sidebarUserName">Carregando...</span>
                        </div>
                        <div class="header-actions">
                            <i class="fa-regular fa-circle-check"></i>
                            <i class="fa-regular fa-message"></i>
                            <i class="fa-regular fa-ellipsis-vertical"></i>
                        </div>
                    </div>
                    <div class="search-area">
                        <div class="search-box-chat">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchConversations"
                                placeholder="Procurar ou criar uma nova conversa">
                        </div>
                    </div>
                    <div class="conversations-list" id="conversationsList"></div>
                </div>

                <div class="chat-area" id="emptyChat">
                    <div style="
                    display:flex; 
                    flex-direction:column; 
                    justify-content:center;
                    align-items:center; 
                    width:100%; 
                    height:100%; 
                    text-align:center; 
                    padding:40px;">

                    <i class="fa-solid fa-comments" style="font-size:60px; margin-bottom:20px; opacity:.5;"> </i>

                        <h2>Nenhuma conversa selecionada</h2>

                        <p>Escolha um profissional para iniciar uma conversa.</p>
                    </div>
                </div>

                <!-- ÁREA PRINCIPAL CHAT -->
                <div class="chat-area" id="chatArea" style="display:none;">

                    <div class="chat-header-whats">
                        <div class="chat-contact-info">
                            <button class="back-mobile" id="backMobileBtn">
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>

                            <div class="contact-avatar">
                                <i class="fa-solid fa-user-doctor" id="contactAvatarIcon"></i>
                            </div>

                            <div class="contact-details">
                                <h4 id="contactName"></h4>

                                <div class="contact-status">
                                    <span class="online-dot" id="statusDot"></span>
                                    <span id="statusText">Online</span>
                                </div>
                            </div>
                        </div>

                        <div class="chat-actions">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <i class="fa-regular fa-circle-user"></i>
                            <i class="fa-regular fa-ellipsis-vertical"></i>
                        </div>
                    </div>

                    <div class="messages-area" id="messagesArea"></div>

                    <div class="input-area">
                        <div class="input-icons">
                            <i class="fa-regular fa-face-smile"></i>
                            <i class="fa-regular fa-paperclip"></i>
                        </div>

                        <input type="text" class="message-input" id="messageInput" placeholder="Escrever mensagem">

                        <div class="send-icon" id="sendBtn">
                            <i class="fa-regular fa-paper-plane"></i>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/utente/mensagens.js"></script>
    <script src="/js/header.js"></script>
</body>

</html>
