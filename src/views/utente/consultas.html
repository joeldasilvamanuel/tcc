<!DOCTYPE html>
<html lang="pt" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/logo02.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/utente/utenteDash.css">
    <link rel="stylesheet" href="/css/utente/consultas.css">
    <title>Health Access Hub | Minha Consulta</title>
    <style>
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="expanded">

            <div class="sidebar-top">
                <div class="logo-box">
                    <img src="/img/logo02.png" alt="Health Access Hub">
                </div>

                <button id="toggleSidebar" class="toggle-btn">
                    <!-- <i class="fa-solid fa-chevron-left"></i> -->
                    <!-- <i class="fa-solid fa-columns"></i> -->
                    <i class="fa-solid fa-angles-left"></i>
                </button>
                <!-- <i class="fa-solid fa-bars"></i><i class="fa-solid fa-outdent"></i> -->
            </div>

            <!-- MENU UTENTE -->
            <nav class="navbar">
                <ul class="nav-list">

                    <li>
                        <a href="/dashboard/utente" class="nav-link">
                            <i class="fa-solid fa-house"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/exames" class="nav-link">
                            <i class="fa-solid fa-file-medical"></i>
                            <span>Sinais Vitais</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/mensagens" class="nav-link">
                            <i class="fa-solid fa-message"></i>
                            <span>Mensagens</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/consultas" class="nav-link active">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span>Agendar Consultas</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/prescricao" class="nav-link">
                            <i class="fa-solid fa-file-prescription"></i>
                            <span>Prescrição</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/historico" class="nav-link">
                            <i class="fa-solid fa-notes-medical"></i>
                            <span>Histórico Clínico</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/perfil" class="nav-link">
                            <i class="fa-solid fa-user"></i>
                            <span>Perfil</span>
                        </a>
                    </li>

                </ul>
            </nav>

            <a href="/auth/logout" class="nav-link logout">
                <i class="fa-solid fa-gear"></i>
                <span>Definições</span>
            </a>

            <!-- LOGOUT -->
            <div class="logout-area">
                <a href="/auth/logout" class="nav-link logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </a>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main>
            <header class="main-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" placeholder="Pesquise consultas...">
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="user-avatar"><img src="/img/fotoPadra.png" alt="Avatar" id="headerAvatar"></div>
                        <div class="user-info">
                            <p class="user-name" id="userName">Carregando...</p>
                            <p class="user-role" id="userRole">Utente</p>
                        </div>
                    </div>
                </div>
            </header>

            <section class="booking-section">
                <div class="content-card booking-card">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-calendar-plus"></i> Agendar Consulta</h2>
                        <p>Os campos com * são obrigatórios.</p>
                    </div>

                    <!-- Formulário preparado para manipulação via JS -->
                    <form id="formAgendamento" class="">

                        <!-- Informações do Utente (Mantidos, mas podem vir pré-preenchidos ou readonly se preferir) -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nome_completo">Nome Completo *</label>
                                <input type="text" name="nome_completo" id="nome_completo"
                                    placeholder="Como consta no documento" required>
                            </div>
                            <div class="form-group">
                                <label for="telefone">Telefone *</label>
                                <input type="tel" name="telefone" id="telefone" placeholder="(+244) ..." required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" name="email" id="email" placeholder="exemplo@email.com">
                            </div>
                            <div class="form-group">
                                <label for="id_esp">Especialidade *</label>
                                <select name="id_esp" id="id_esp" required>
                                    <option value="">Carregando especialidades...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Dados da Consulta -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="data_consulta">Data da Consulta *</label>
                                <input type="date" name="data_consulta" id="data_consulta" required>
                            </div>
                            <div class="form-group">
                                <label for="horario_consult">Horário *</label>
                                <input type="time" name="horario_consulta" id="horario_consulta" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="observacoes">Observações / Sintomas</label>
                            <textarea name="observacoes" id="observacoes" rows="3"
                                placeholder="Algo que o médico deva saber antecipadamente..."></textarea>
                        </div>

                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-check"></i> Finalizar Agendamento
                        </button>
                    </form>
                </div>
            </section>

            <!-- MANTENDO AS MÉTRICAS ABAIXO -->
            <section class="metrics-grid-mini">
                <div class="metric-card-mini">
                    <i class="fa-solid fa-calendar-check text-blue"></i>
                    <div>
                        <h3 id="totalRealizadas">3</h3>
                        <p>Realizadas</p>
                    </div>
                </div>
                <div class="metric-card-mini">
                    <i class="fa-solid fa-clock text-blue"></i>
                    <div>
                        <h3>5 dias</h3>
                        <p>Próxima</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <!-- ALL JAVASCRIPT LINK OF CODE -->
    <script src="/js/header.js"></script>
    <script src="/js/utenteDash.js"></script>
    <!-- js dashboard -->
    <script src="/js/profDash.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            const selectEspecialidade = document.getElementById('id_esp');
            const inputData = document.getElementById('data_consulta');
            const form = document.getElementById('formAgendamento');

            // =========================
            // TOAST SYSTEM (SEM HTML EXTRA)
            // =========================
            function showToast(message, type = 'success') {

                const toast = document.createElement('div');

                toast.textContent = message;

                toast.style.position = 'fixed';
                toast.style.top = '20px';
                toast.style.right = '20px';
                toast.style.padding = '12px 18px';
                toast.style.borderRadius = '10px';
                toast.style.color = '#fff';
                toast.style.fontSize = '14px';
                toast.style.zIndex = '9999';
                toast.style.boxShadow = '0 10px 25px rgba(0,0,0,0.15)';
                toast.style.transition = 'all 0.3s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';

                if (type === 'success') {
                    toast.style.background = '#28a745';
                } else {
                    toast.style.background = '#dc3545';
                }

                document.body.appendChild(toast);

                // animação entrada
                setTimeout(() => {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateY(0)';
                }, 50);

                // remover automático
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // =========================
            // bloquear datas passadas
            // =========================
            const hoje = new Date().toISOString().split('T')[0];
            inputData.min = hoje;

            // =========================
            // CARREGAR ESPECIALIDADES
            // =========================
            async function carregarEspecialidades() {
                try {
                    const res = await fetch('/api/agendamentos/especialidades');

                    if (!res.ok) throw new Error('Erro API especialidades');

                    const data = await res.json();

                    selectEspecialidade.innerHTML =
                        '<option value="">Selecione a especialidade</option>';

                    data.forEach(esp => {
                        selectEspecialidade.innerHTML += `
                    <option value="${esp.id_esp}">
                        ${esp.nome_esp}
                    </option>
                `;
                    });

                } catch (err) {
                    console.error('Erro especialidades:', err);
                    selectEspecialidade.innerHTML =
                        '<option value="">Erro ao carregar especialidades</option>';

                    showToast('Erro ao carregar especialidades', 'error');
                }
            }

            // =========================
            // SUBMIT AGENDAMENTO
            // =========================
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const dados = Object.fromEntries(new FormData(form).entries());

                try {
                    const res = await fetch('/api/agendamentos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dados)
                    });

                    const json = await res.json();

                    if (!res.ok) {
                        showToast(json.mensagem || 'Erro ao agendar', 'error');
                        return;
                    }

                    showToast('Agendamento realizado com sucesso!', 'success');
                    form.reset();

                } catch (err) {
                    console.error(err);
                    showToast('Erro de ligação ao servidor', 'error');
                }
            });

            // INIT
            carregarEspecialidades();

        });
    </script>
</body>

</html>
