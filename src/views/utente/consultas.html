<!DOCTYPE html>
<html lang="pt" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/logo02.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/utente/utenteDash.css">
    <link rel="stylesheet" href="/css/utente/consultas.css">
    <title>Health Access Hub | Minha Consulta</title>
</head>

<body>
    <div class="app">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="expanded">

            <div class="sidebar-top">
                <div class="logo-box">
                    <img src="/img/logo02.png" alt="Health Access Hub">
                </div>

                <button id="toggleSidebar" class="toggle-btn">
                    <!-- <i class="fa-solid fa-chevron-left"></i> -->
                    <!-- <i class="fa-solid fa-columns"></i> -->
                    <i class="fa-solid fa-angles-left"></i>
                </button>
                <!-- <i class="fa-solid fa-bars"></i><i class="fa-solid fa-outdent"></i> -->
            </div>

            <!-- MENU UTENTE -->
            <nav class="navbar">
                <ul class="nav-list">

                    <li>
                        <a href="/dashboard/utente" class="nav-link">
                            <i class="fa-solid fa-house"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/exames" class="nav-link">
                            <i class="fa-solid fa-file-medical"></i>
                            <span>Sinais Vitais</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/mensagens" class="nav-link">
                            <i class="fa-solid fa-message"></i>
                            <span>Mensagens</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/consultas" class="nav-link active">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span>Agendar Consultas</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/prescricao" class="nav-link">
                            <i class="fa-solid fa-file-prescription"></i>
                            <span>Prescrição</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/historico" class="nav-link">
                            <i class="fa-solid fa-notes-medical"></i>
                            <span>Histórico Clínico</span>
                        </a>
                    </li>

                    <li>
                        <a href="/dashboard/utente/perfil" class="nav-link">
                            <i class="fa-solid fa-user"></i>
                            <span>Perfil</span>
                        </a>
                    </li>

                </ul>
            </nav>

            <a href="/auth/logout" class="nav-link logout">
                <i class="fa-solid fa-gear"></i>
                <span>Definições</span>
            </a>

            <!-- LOGOUT -->
            <div class="logout-area">
                <a href="/auth/logout" class="nav-link logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </a>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main>
            <header class="main-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" placeholder="Pesquise consultas...">
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="user-avatar"><img src="/img/fotoPadra.png" alt="Avatar" id="headerAvatar"></div>
                        <div class="user-info">
                            <p class="user-name" id="userName">Carregando...</p>
                            <p class="user-role" id="userRole">Utente</p>
                        </div>
                    </div>
                </div>
            </header>

            <section class="booking-section">
                <div class="content-card booking-card">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-calendar-plus"></i> Agendar Consulta</h2>
                        <p>Os campos com * são obrigatórios.</p>
                    </div>

                    <!-- Formulário preparado para manipulação via JS -->
                    <form id="formAgendamento" class="">

                        <!-- Informações do Utente (Mantidos, mas podem vir pré-preenchidos ou readonly se preferir) -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nome_completo">Nome Completo *</label>
                                <input type="text" name="nome_completo" id="nome_completo"
                                    placeholder="Como consta no documento" required>
                            </div>
                            <div class="form-group">
                                <label for="telefone">Telefone *</label>
                                <input type="tel" name="telefone" id="telefone" placeholder="(+244) ..." required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" name="email" id="email" placeholder="exemplo@email.com">
                            </div>
                            <div class="form-group">
                                <label for="id_esp">Especialidade *</label>
                                <select name="id_esp" id="id_esp" required>
                                    <option value="">Carregando especialidades...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Dados da Consulta -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="data_consulta">Data da Consulta *</label>
                                <input type="date" name="data_consulta" id="data_consulta" required>
                            </div>
                            <div class="form-group">
                                <label for="horario_consult">Horário *</label>
                                <input type="time" name="horario_consult" id="horario_consult" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="observacoes">Observações / Sintomas</label>
                            <textarea name="observacoes" id="observacoes" rows="3"
                                placeholder="Algo que o médico deva saber antecipadamente..."></textarea>
                        </div>

                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-check"></i> Finalizar Agendamento
                        </button>
                    </form>
                </div>
            </section>

            <!-- MANTENDO AS MÉTRICAS ABAIXO -->
            <section class="metrics-grid-mini">
                <div class="metric-card-mini">
                    <i class="fa-solid fa-calendar-check text-blue"></i>
                    <div>
                        <h3 id="totalRealizadas">3</h3>
                        <p>Realizadas</p>
                    </div>
                </div>
                <div class="metric-card-mini">
                    <i class="fa-solid fa-clock text-blue"></i>
                    <div>
                        <h3>5 dias</h3>
                        <p>Próxima</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ALL JAVASCRIPT LINK OF CODE -->
    <script src="/js/header.js"></script>
    <script src="/js/utenteDash.js"></script>
    <!-- js dashboard -->
    <script src="/js/profDash.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const selectEspecialidade = document.getElementById('id_esp');
            const inputData = document.getElementById('data_consulta');
            const form = document.getElementById('formAgendamento');

            // 1. Impedir o agendamento em dias passados
            const hoje = new Date().toISOString().split('T')[0];
            inputData.min = hoje;

            // 2. CORREÇÃO: Caminho absoluto apontando para o grupo de rotas do utente
            try {
                const resposta = await fetch('/dashboard/utente/api/especialidades');
                if (!resposta.ok) throw new Error('Erro ao buscar do servidor');

                const especialidades = await resposta.json();

                selectEspecialidade.innerHTML = '<option value="">Selecione a especialidade</option>';
                especialidades.forEach(esp => {
                    selectEspecialidade.innerHTML += `<option value="${esp.id}">${esp.nome}</option>`;
                });
            } catch (error) {
                selectEspecialidade.innerHTML = '<option value="">Erro ao carregar especialidades</option>';
                console.error('Erro de API:', error);
            }

            // 3. Processar e enviar o agendamento via POST para o Controller
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Captura os dados digitados
                const formData = new FormData(form);
                const dadosObjeto = Object.fromEntries(formData.entries());

                try {
                    // CORREÇÃO: Caminho absoluto do POST alinhado com a plataforma
                    const respostaEnvio = await fetch('/dashboard/utente/agendar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(dadosObjeto)
                    });

                    const resultado = await respostaEnvio.json();

                    if (respostaEnvio.ok) {
                        alert(resultado.mensagem || 'Agendamento concluído com sucesso!');
                        window.location.href = '/dashboard/utente/mensagens';
                    } else {
                        alert(resultado.mensagem || 'Ocorreu um erro ao tentar agendar.');
                    }

                } catch (error) {
                    console.error('Erro na requisição:', error);
                    alert('Erro crítico de conexão com o servidor.');
                }
            });
        });
    </script>
</body>

</html>
